<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chess Coach</title>
  <link rel="stylesheet" href="panel.css">
  <style>
    body { width: 260px; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .langs { display: grid; gap: 6px; }
    .langs button {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 10px 12px; border-radius: 8px;
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      font: inherit; cursor: pointer; text-align: left;
    }
    .langs button:hover { border-color: var(--muted); }
    .langs button.on { border-color: var(--green); }
    .langs button.on::after { content: "✓"; color: var(--green); font-weight: 700; }
    .note { margin: 12px 0 0; }
  </style>
</head>
<body>
  <h1>♞ <span data-i18n="popupTitle">Chess Coach</span></h1>
  <div class="label" data-i18n="language">Language</div>
  <div class="langs" id="langs">
    <button data-lang="auto"><span data-i18n="autoBrowser">Auto (browser language)</span></button>
    <button data-lang="en">English</button>
    <button data-lang="zh">中文</button>
  </div>
  <p class="note muted small" data-i18n="popupNote">Applies right away to the coach panel on chess.com.</p>
  <script src="popup.js"></script>
</body>
</html>
